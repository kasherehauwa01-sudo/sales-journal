# Добавьте эти location внутрь УЖЕ СУЩЕСТВУЮЩЕГО server { } для kvasmix.ru.
# Новый server/server_name создавать не нужно.
# В HTTPS server добавьте: ssl_crl /etc/nginx/sales-mtls/crl.pem;
location = /vr/sales { return 301 /vr/sales/; }
location ^~ /vr/sales/api/ {
    proxy_pass http://127.0.0.1:8010/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /vr/sales;
    proxy_set_header X-Sales-MTLS-Verify $ssl_client_verify;
    proxy_set_header X-Sales-MTLS-CN $ssl_client_s_dn_cn;
    proxy_set_header X-Sales-MTLS-Serial $ssl_client_serial;
    # Файл содержит proxy_set_header X-Sales-Proxy-Secret "..." и не хранится в Git.
    include /etc/nginx/snippets/sales-mtls-proxy-secret.conf;
    client_max_body_size 200m;
    proxy_read_timeout 600s;
}
location ^~ /vr/sales/ {
    proxy_pass http://127.0.0.1:8011;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
