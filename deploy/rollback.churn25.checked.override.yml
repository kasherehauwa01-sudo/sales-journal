# Reviewed maintenance rollback only; retain schema25 and all stored data.
# Append last after the original server Compose files, in their unchanged order.
services:
  backend:
    image: "${SALES_ROLLBACK_IMAGE:?Pin the tested immutable old image ID}"
    build: !reset null
    pull_policy: never
    restart: "no"
    stop_grace_period: 30s
    command: ["python", "-B", "/run/sales-rollback/start_backend.py", "--rollback", "--expected-revision", "20261030_25"]
    environment:
      ANALYTICS_SIGNALS_ENABLED: "false"
      ANALYTICS_SIGNALS_MODE: SHADOW
      ANALYTICS_AUTOMATION_ENABLED: "false"
    volumes:
      - type: bind
        source: "${SALES_ROLLBACK_LAUNCHER:?Absolute reviewed revision25-compatible start_backend.py path}"
        target: /run/sales-rollback/start_backend.py
        read_only: true
