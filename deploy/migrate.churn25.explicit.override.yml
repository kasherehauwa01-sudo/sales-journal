# Append after ALL existing server overrides. Opt-in, exact target, never ordinary up.
services:
  schema-migrate:
    profiles: ["schema-maintenance"]
    image: "${SALES_CANDIDATE_IMAGE:?Pin the reviewed revision25 candidate image}"
    pull_policy: never
    restart: "no"
    command: ["python", "-B", "start_backend.py", "--migrate", "--expected-revision", "20261030_25"]
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-sales}:${POSTGRES_PASSWORD:?Required}@db:5432/${POSTGRES_DB:-sales}"
      ANALYTICS_SIGNALS_ENABLED: "false"
      ANALYTICS_SIGNALS_MODE: SHADOW
      ANALYTICS_AUTOMATION_ENABLED: "false"
